amcl:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0   # FIX: ERA 1.2 — prea restrictiv pentru cameră 9x4m
    laser_max_range: 8.0
    laser_min_range: 0.03
    laser_model_type: "likelihood_field"
    max_beams: 300
    max_particles: 5000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1      # FIX: ERA 0.0 — recovery complet dezactivat!
    recovery_alpha_slow: 0.001    # FIX: ERA 0.0 — fără asta AMCL nu se auto-corectează
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15               # FIX: ERA 0.08 — prea strâns vs noise STL-19P (STD 15mm@2-12m)
    tf_broadcast: true
    transform_tolerance: 0.30
    update_min_a: 0.05
    update_min_d: 0.10
    z_hit: 0.65
    z_max: 0.05
    z_rand: 0.35
    z_short: 0.05
    scan_topic: scan
    map_topic: map    
    set_initial_pose: true
    always_reset_initial_pose: false
    #first_map_only: false   
    initial_pose:
      x: 1.1
      y: 0.32
      z: 0.00
      yaw: 0.0
      

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 8.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_timeout: 0.3
    simulate_ahead_time: 3.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.2

bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/odom"
    bt_loop_duration: 10          # ms - durata unui tick BT
    # IMPORTANT: default_server_timeout este in MILISECUNDE in Jazzy!
    # 20ms = timeout instant -> cauzeaza "Timed out waiting for follow_path/compute_path"
    # CORECT: 10000ms = 10s, suficient pentru planner (max 3s) si controller start
    default_server_timeout: 10000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    # BT XML simplu fara replanning agresiv la 1Hz care cauzeaza timeout
    # la follow_path cand controller_server e deja ocupat (a primit path de la alt BT tick)
    default_nav_to_pose_bt_xml: "/home/saim/dummybot-ros2-encoder/ros2_ws/src/amr2ax_nav2/behavior_trees/navigate_to_pose_simple.xml"

    # Parametrii pentru codurile de eroare
    error_code_names: ["follow_path_error_code", "compute_path_error_code"]


controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: true 
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.03
    min_y_velocity_threshold: 0.03
    min_theta_velocity_threshold: 0.1
    failure_tolerance: 0.0

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.10
      batch_size: 350
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.3
      # SYNCED with diff_drive_controller limits
      vx_max: 6.0
      vx_min: -6.0
      vy_max: 0.0           # No lateral movement (diff-drive)
      wz_max: 3.0
      ax_max: 6.0
      ax_min: -6.0
      ay_max: 0.0
      az_max: 8.2
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.15
      temperature: 0.2
      gamma: 0.015
      robot_mass: 5.0
      motion_model: "DiffDrive"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5
        critical_cost: 250.0
        consider_footprint: true
        collision_cost: 800000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2
      

