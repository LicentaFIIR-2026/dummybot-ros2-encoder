    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false          # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      tolerance: 0.25                     # increase tolerance to accept nearby valid endpoints when goal lies on/near obstacles
      allow_unknown: true                 # allow traveling in unknown space
      max_iterations: 800000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0              # redus de la 8.0 - harta 9x4m, distante scurte
      motion_model_for_search: "REEDS_SHEPP"    # Hybrid-A* Dubin, Redds-Shepp
      angle_quantization_bins: 72         # Number of angle bins for search
      analytic_expansion_ratio: 3.5       # The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 2.5  # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      minimum_turning_radius: 0.1        # minimum turning radius in m of path / vehicle
      reverse_penalty: 1.5                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.2           # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      retrospective_penalty: 0.015
      lookup_table_size: 5.0              # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsiquent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      debug_visualizations: false         # For Hybrid nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning) and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the performance.
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true                   # If true, does a simple and quick smoothing post-processing to the path

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

#planner_server_rclcpp_node:
#  ros__parameters:
#    use_sim_time: false

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    loop_rate: 25
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2000

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    smoothing_frequency: 15.0    # SPEED: ERA 8.0 — smoother-ul reacționează mai repede la schimbări de viteză
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 3.14]   # SPEED: ERA [1.5, 0.0, 3.0] — match cu vx_max din MPPI
    min_velocity: [-0.3, 0.0, -3.14]  # SPEED: ERA [-1.5, 0.0, -3.0] — match cu vx_min
    max_accel: [4.5, 0.0, 4.5]      # SPEED: ERA [3.0, 0.0, 3.5] — match cu ax_max
    max_decel: [-4.5, 0.0, -4.5]    # SPEED: ERA [-3.0, 0.0, -3.5] — match cu ax_min
    odom_topic: "/odom"
    odom_duration: 0.1               # SPEED: ERA 0.15 — răspuns mai rapid
    deadband_velocity: [0.01, 0.0, 0.03]  # SPEED: ERA [0.02, 0.0, 0.05] — deadband mai mic
    velocity_timeout: 1.5

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.3
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    
    polygons: ["FootprintApproach"]
    
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 4
      visualize: true
      enabled: true
    
    observation_sources: ["scan"]
    
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.05
      max_height: 0.4
      enabled: true

# Docking Server
docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true 
    controller_frequency: 30.0
    initial_perception_timeout: 10.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    
    dock_plugins: ['xplorer_dock']
    xplorer_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.40
      staging_x_offset: -0.30
      
      use_external_detection_pose: true
      external_detection_timeout: 2.0
      external_detection_topic: '/detected_dock_pose'
      #subscribe_toggle: true
      
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0
      external_detection_translation_z: 0.0
      #external_detection_rotation_roll: 0.0
      #external_detection_rotation_pitch: 0.0
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
      
      filter_coef: 0.3
      
      use_battery_status: false
      use_stall_detection: false
      #stall_joint_names: ['left_front_wheel_joint', 'right_front_wheel_joint', 'left_rear_wheel_joint', 'right_rear_wheel_joint']  # ← ADĂUGAT
      #stall_velocity_threshold: 0.15  # ← ADĂUGAT (2cm/s)
      #stall_effort_threshold: 0.0  # ← ADĂUGAT (nu folosim effort)      
      
    docks: ['test_dock']
    test_dock:
      type: 'xplorer_dock'
      frame: 'map'
      pose: [0.40, 0.34, 0.0] # TF odom→tag36h11:-0.219 -0.213 -0.708
      #pose: [0.5, 0.85, -0.908] # TF odom→tag36h11:-0.219 -0.213 -0.708
      #pose: [0.10, 0.18, -3.14]  # TF odom→tag36h11:0

    
    controller:
      k_phi: 1.8
      k_delta: 0.6
      beta: 0.4
      lambda: 2.0      
      v_linear_min: 0.05
      v_linear_max: 0.15
      #use_collision_detection: false
      v_angular_max: 0.75
      slowdown_radius: 0.25
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.8

# Lifecycle Manager
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server', 'planner_server', 'behavior_server', 
                 'bt_navigator', 'waypoint_follower', 'velocity_smoother', 
                 'docking_server']