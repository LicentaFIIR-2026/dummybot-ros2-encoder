    semantic_objects_path: '/home/saim/dummybot-ros2-encoder/ros2_ws/maps/semantic_objects.geojson'

    # --- Topics ROS2 ---
    camera_topic: '/camera/image_raw/compressed'
    pose_topic: '/amcl_pose'